# One-click deploy on Render (Blueprint):
#   https://render.com/deploy?repo=https://github.com/rajatul007/Text-to-image-Generator-Imagify
# Creates the web app, a PostgreSQL database and a persistent disk for images.
# Keys marked "sync: false" are asked for in the deploy form – leave optional ones blank.

databases:
  - name: texttoimage-db
    plan: basic-256mb
    region: singapore
    databaseName: texttoimage
    user: texttoimage

services:
  - type: web
    name: text-to-image-generator
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts
    startCommand: npm start
    healthCheckPath: /api/models
    disk:
      name: images
      mountPath: /opt/render/project/src/storage
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: texttoimage-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: JOB_RUNNER
        value: inline
      - key: EMAIL_PROVIDER
        value: console
      # Your email – becomes admin after you sign up and verify it
      - key: ADMIN_EMAILS
        sync: false
      # Image providers – fill at least one
      - key: STABILITY_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLIPDROP_API_KEY
        sync: false
      # Prompt enhancer (OpenAI-compatible key)
      - key: LLM_API_KEY
        sync: false
      # Razorpay (optional – payments stay disabled until set)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Email delivery (optional) – set EMAIL_PROVIDER=resend later in the dashboard
      - key: RESEND_API_KEY
        sync: false
